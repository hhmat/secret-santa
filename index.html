<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>🎄 Secret Santa 2026</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<header class="header">

<h1>🎄 Secret Santa 2026 🎅</h1>

<p>
🏉 TuT - TTR Nottingham Secret Santa 2026 🎄
</p>

</header>

<div class="container">

<div
id="authCard"
class="card">

<h2>Register</h2>

<input
id="name"
placeholder="Name">

<input
id="email"
placeholder="Email">

<input
id="password"
type="password"
placeholder="Password">

<textarea
id="wishlist"
placeholder="Wishlist (one item per line)">
</textarea>

<button id="registerBtn">

Join Secret Santa

</button>

<hr>

<h2>Login</h2>

<input
id="loginEmail"
placeholder="Email">

<input
id="loginPassword"
type="password"
placeholder="Password">

<button id="loginBtn">

Login

</button>

</div>

<div
id="dashboard"
class="card hidden">

<h2>Dashboard</h2>

<p>

Welcome

<strong id="userName"></strong>

</p>

<p>

Recipient:

<span id="recipient">

Not assigned yet

</span>

</p>

<h3>Wishlist</h3>

<textarea
id="wishlistEdit"></textarea>

<button
id="saveWishlistBtn">

Save Wishlist

</button>

<h3>RSVP</h3>

<select id="rsvp">

<option value="true">

✅ Attending

</option>

<option value="false">

❌ Not Attending

</option>

</select>

<button
id="saveRsvpBtn">

Save RSVP

</button>

<button
id="logoutBtn">

Logout

</button>

</div>

</div>

<button id="showAdmin">

Admin Login

</button>

<div
id="adminPanel"
class="card hidden">

<h2>Admin Dashboard</h2>

<p>

Registrations:
<span id="participantCount">
0
</span>

</p>

<p>

Budget:
£<span id="budgetDisplay">
20
</span>

</p>

<input
id="budgetInput"
type="number"
value="20">

<button id="saveBudgetBtn">

Save Budget

</button>

<button id="toggleRegistrationBtn">

Close Registration

</button>

<button id="generateDrawBtn">

Generate Draw

</button>

<div id="participantList">

</div>

</div>

  
<script
type="module"
src="app.js"></script>

</body>
</html>
