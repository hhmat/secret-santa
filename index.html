<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>🎄 TuT - TTR Nottingham Secret Santa 2026</title>

  <link
    rel="stylesheet"
    href="style.css">

</head>

<body>

  <header class="header">

    <h1>
      🎄 Secret Santa 2026 🎅
    </h1>

    <p>
      🏉 TuT - TTR Nottingham Secret Santa 2026
    </p>

  </header>

  <div class="container">

    <!-- REGISTRATION / LOGIN -->

    <div
      id="authCard"
      class="card">

      <h2>Join Secret Santa</h2>

      <input
        id="name"
        type="text"
        placeholder="Your Name">

      <input
        id="email"
        type="email"
        placeholder="Email Address">

      <input
        id="password"
        type="password"
        placeholder="Choose Password">

      <textarea
        id="wishlist"
        rows="5"
        placeholder="Wishlist (one item per line)"></textarea>

      <button id="registerBtn">

        Join Secret Santa

      </button>

      <hr>

      <h2>Login</h2>

      <input
        id="loginEmail"
        type="email"
        placeholder="Email Address">

      <input
        id="loginPassword"
        type="password"
        placeholder="Password">

      <button id="loginBtn">

        Login

      </button>

    </div>

    <!-- PARTICIPANT DASHBOARD -->

    <div
      id="dashboard"
      class="card hidden">

      <h2>
        Participant Dashboard
      </h2>

      <p>

        Welcome
        <strong id="userName"></strong>

      </p>

      <p>

        🎁 Your Recipient:

        <strong id="recipient">

          Not assigned yet

        </strong>

      </p>

      <p>

        💷 Budget:
        £<span id="budget">20</span>

      </p>

      <h3>

        🎁 Wishlist

      </h3>

      <textarea
        id="wishlistEdit"
        rows="5"></textarea>

      <button
        id="saveWishlistBtn">

        Save Wishlist

      </button>

      <h3>

        ✅ RSVP

      </h3>

      <select id="rsvp">

        <option value="true">

          ✅ Attending

        </option>

        <option value="false">

          ❌ Not Attending

        </option>

      </select>

      <button
        id="saveRsvpBtn">

        Save RSVP

      </button>

      <hr>

      <button
        id="logoutBtn">

        Logout

      </button>

    </div>

    <!-- ADMIN DASHBOARD -->

    <div
      id="adminPanel"
      class="card hidden">

      <h2>

        🎅 Admin Dashboard

      </h2>

      <p>

        Admin Account:

        <strong>
          admin@ttrnottingham.com
        </strong>

      </p>

      <hr>

      <p>

        Registrations:

        <strong
          id="participantCount">

          0

        </strong>

      </p>

      <p>

        Budget:

        £<span id="budgetDisplay">

          20

        </span>

      </p>

      <input
        id="budgetInput"
        type="number"
        min="1"
        value="20">

      <button
        id="saveBudgetBtn">

        Save Budget

      </button>

      <hr>

      <button
        id="toggleRegistrationBtn">

        Open / Close Registration

      </button>

      <button
        id="generateDrawBtn">

        🎲 Generate Secret Santa Draw

      </button>

      <hr>

      <h3>

        Participants

      </h3>

      <div id="participantList">

      </div>

    </div>

  </div>

  <script
    type="module"
    src="app.js"></script>

</body>

</html>
